<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rust Range</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&display=swap">
<style>
/* Layout: full-bleed 3D view. HUD pinned to the four corners, weapon slots top center, crosshair centered, one menu card over the arena. Single dark look by choice. */
:root {
  --bg: #0e0f0d;
  --ink: #ece6d6;
  --muted: #a39e90;
  --hazard: #ff7a1a;
  --danger: #e5392b;
  --ok: #8fd14f;
  --panel: rgba(14, 15, 13, 0.86);
  --line: rgba(236, 230, 214, 0.18);
  --font-num: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --font-cjk: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-cjk); }
#stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--bg); user-select: none; -webkit-user-select: none; }
canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

#hud {
  position: absolute; inset: 0; pointer-events: none;
  display: flex; flex-direction: column; justify-content: space-between;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.row:last-child { align-items: flex-end; }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat.right { align-items: flex-end; text-align: right; }
.lab { font-size: 12px; letter-spacing: 0.2em; color: var(--muted); }
.stat b { font-family: var(--font-num); font-weight: 700; font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.sub { font-size: 13px; color: var(--hazard); min-height: 1.2em; }
.bar { width: min(220px, 46vw); height: 10px; background: rgba(0,0,0,.5); border: 1px solid var(--line); }
.bar i { display: block; height: 100%; width: 100%; background: var(--ok); transition: width .15s, background .15s; }

.slots { display: flex; gap: 6px; pointer-events: auto; }
.slot { width: 46px; height: 44px; padding: 0; background: rgba(14,15,13,.6); border: 1px solid var(--line); color: var(--muted); font-family: var(--font-num); font-weight: 700; font-size: 17px; line-height: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; touch-action: manipulation; }
.slot small { font-family: var(--font-cjk); font-size: 10px; font-weight: 400; }
.slot.on { border-color: var(--hazard); color: var(--ink); background: rgba(255,122,26,.24); }
.slots { flex-wrap: wrap; justify-content: center; max-width: 60%; }
@media (max-width: 600px) { .slot { width: 34px; height: 36px; font-size: 14px; } .slot small { display: none; } }

#cross { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
#cross span { position: absolute; background: var(--ink); opacity: .85; box-shadow: 0 0 2px #000; }
#cross .h1, #cross .h2 { height: 2px; width: 9px; top: -1px; }
#cross .h1 { left: -16px; } #cross .h2 { left: 7px; }
#cross .v1, #cross .v2 { width: 2px; height: 9px; left: -1px; }
#cross .v1 { top: -16px; } #cross .v2 { top: 7px; }
#cross .dot { width: 2px; height: 2px; left: -1px; top: -1px; }
#mark { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; opacity: 0; pointer-events: none; transition: opacity .12s; }
#mark::before, #mark::after { content: ""; position: absolute; left: 12px; top: -2px; width: 2px; height: 30px; background: var(--ink); }
#mark::before { transform: rotate(45deg); } #mark::after { transform: rotate(-45deg); }
#mark.on { opacity: 1; transition: none; }
#mark.kill::before, #mark.kill::after { background: var(--danger); }

#reticle { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; filter: drop-shadow(0 0 2px #000); }
#scope { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 50%, transparent 0, transparent 31vmin, #000 31.4vmin); }
#scope::before, #scope::after { content: ""; position: absolute; background: #000; }
#scope::before { left: 0; right: 0; top: 50%; height: 1px; }
#scope::after { top: 0; bottom: 0; left: 50%; width: 1px; }

#hurt { position: absolute; inset: 0; pointer-events: none; opacity: 0; box-shadow: inset 0 0 140px 30px var(--danger); transition: opacity .35s; }
#hurt.on { opacity: .85; transition: none; }
#banner { position: absolute; left: 0; right: 0; top: 24%; text-align: center; pointer-events: none; opacity: 0; transition: opacity .4s; font-size: clamp(24px, 6vw, 46px); font-weight: 700; letter-spacing: .3em; color: var(--hazard); text-shadow: 0 2px 12px rgba(0,0,0,.8); padding-left: .3em; }
#banner.on { opacity: 1; }

#menu { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8, 8, 7, 0.55); padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-y: auto; }
.card { width: 100%; max-width: 460px; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-top: 6px solid var(--hazard); padding: 22px; display: flex; flex-direction: column; gap: 16px; margin: auto; }
.eyebrow { font-family: var(--font-num); letter-spacing: .3em; font-size: 14px; color: var(--hazard); font-weight: 700; }
.card h1 { margin: 0; font-size: 40px; letter-spacing: .12em; line-height: 1.1; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; margin: 0; }
.keys dt { font-family: var(--font-num); font-weight: 700; font-size: 16px; color: var(--ink); letter-spacing: .06em; white-space: nowrap; }
.keys dd { margin: 0; color: var(--muted); }
.go { font-family: inherit; font-size: 18px; font-weight: 700; letter-spacing: .3em; padding: 14px 16px 14px calc(16px + .3em); background: var(--hazard); color: #1a0f05; border: 0; cursor: pointer; }
.go:hover { filter: brightness(1.08); }
.card.wide { max-width: 760px; }
.lobby-sec { display: flex; flex-direction: column; gap: 8px; }
.lobby-sec h2 { margin: 0; font-size: 12px; letter-spacing: .24em; color: var(--muted); font-weight: 400; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.opt { text-align: left; font-family: inherit; color: var(--ink); background: rgba(236,230,214,.05); border: 1px solid var(--line); padding: 10px 12px; cursor: pointer; display: flex; gap: 10px; align-items: center; min-width: 0; }
.opt:hover { background: rgba(236,230,214,.1); }
.opt[aria-pressed="true"] { border-color: var(--hazard); background: rgba(255,122,26,.16); }
.opt b { display: block; font-size: 15px; letter-spacing: .08em; }
.opt small { display: block; color: var(--muted); font-size: 12px; line-height: 1.5; margin-top: 2px; }
.avatar { position: relative; flex: 0 0 44px; width: 44px; height: 58px; }
.avatar i { position: absolute; display: block; }
.avatar .hd { left: 10px; top: 0; width: 24px; height: 18px; background: #2b2723; border-bottom: 5px solid var(--c); }
.avatar .bd { left: 4px; top: 20px; width: 36px; height: 22px; background: var(--c); }
.avatar .lg { left: 10px; top: 44px; width: 24px; height: 14px; background: #2b2723; }
.lobby-foot { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.lobby-foot .go { flex: 1 1 200px; }
.best { font-size: 13px; color: var(--muted); }
.best b { font-family: var(--font-num); font-size: 22px; color: var(--ink); margin-left: 6px; }
.ghost { font-family: inherit; font-size: 14px; letter-spacing: .2em; padding: 11px 16px; background: none; color: var(--ink); border: 1px solid var(--line); cursor: pointer; }
.ghost:hover { border-color: var(--ink); }
#fortBox { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); width: min(300px, 56vw); display: flex; flex-direction: column; align-items: center; gap: 3px; pointer-events: none; }
#fortBox[hidden] { display: none; }
#fortLab { font-size: 11px; letter-spacing: .25em; color: var(--muted); text-transform: uppercase; }
.fbar { width: 100%; height: 12px; background: rgba(0,0,0,.55); border: 1px solid var(--line); }
.fbar i { display: block; height: 100%; width: 100%; background: #d9a441; transition: width .2s; }
#fortNum { font-family: var(--font-num); font-size: 13px; font-variant-numeric: tabular-nums; }
#langBtn { display: none; position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); z-index: 30; font-family: var(--font-num); font-weight: 700; font-size: 13px; letter-spacing: .08em; padding: 8px 12px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); cursor: pointer; }
#langBtn:hover { border-color: var(--ink); }
#menu:not([hidden]) ~ #langBtn, #shop:not([hidden]) ~ #langBtn { display: block; }
#shop, #bag { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8, 8, 7, 0.7); padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-y: auto; }
.shopbar { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { font-family: inherit; font-size: 14px; letter-spacing: .12em; padding: 9px 14px; background: none; color: var(--muted); border: 1px solid var(--line); cursor: pointer; }
.tab.on { color: var(--ink); border-color: var(--hazard); background: rgba(255,122,26,.16); }
.shlist { display: flex; flex-direction: column; gap: 8px; max-height: 46vh; overflow-y: auto; }
.shrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 1px solid var(--line); padding: 10px 12px; }
.shrow > div { min-width: 0; }
.shrow b { font-size: 15px; letter-spacing: .08em; }
.shrow em { font-style: normal; font-size: 11px; color: var(--ok); margin-left: 8px; letter-spacing: .1em; }
.shrow small { display: block; color: var(--muted); font-size: 12px; line-height: 1.5; margin-top: 2px; }
.buy { flex: 0 0 auto; font-family: var(--font-num), var(--font-cjk); font-weight: 700; font-size: 16px; letter-spacing: .06em; padding: 9px 14px; background: var(--hazard); color: #1a0f05; border: 0; cursor: pointer; }
.buy:disabled { background: rgba(236,230,214,.12); color: var(--muted); cursor: default; }
#prompt { position: absolute; left: 0; right: 0; bottom: 24%; text-align: center; pointer-events: none; font-size: 17px; letter-spacing: .15em; color: var(--ink); }
#prompt span { background: var(--panel); border: 1px solid var(--hazard); padding: 8px 16px; }
#bGren { width: 56px; height: 56px; right: max(190px, calc(env(safe-area-inset-right, 0px) + 178px)); bottom: 100px; }
#bBag { width: 56px; height: 56px; right: max(190px, calc(env(safe-area-inset-right, 0px) + 178px)); bottom: 166px; }
#bUse { display: none; width: 64px; height: 64px; right: max(30px, env(safe-area-inset-right, 0px)); bottom: 262px; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

#touch { display: none; position: absolute; inset: 0; }
body.touch #touch { display: block; }
#touchLayer { position: absolute; inset: 0; touch-action: none; }
#stickBase { position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; border: 2px solid var(--line); border-radius: 50%; display: none; pointer-events: none; }
#stickKnob { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: rgba(236,230,214,.35); }
.tbtn { position: absolute; border-radius: 50%; border: 2px solid var(--line); background: rgba(14,15,13,.55); color: var(--ink); font-family: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; touch-action: none; }
.tbtn:active, .tbtn.held { background: var(--hazard); color: #1a0f05; }
#bFire { width: 82px; height: 82px; right: max(18px, env(safe-area-inset-right, 0px)); bottom: 96px; }
#bReload { width: 56px; height: 56px; right: max(112px, calc(env(safe-area-inset-right, 0px) + 100px)); bottom: 84px; }
#bAim { width: 56px; height: 56px; right: max(112px, calc(env(safe-area-inset-right, 0px) + 100px)); bottom: 150px; }
#bJump { width: 56px; height: 56px; right: max(34px, env(safe-area-inset-right, 0px)); bottom: 192px; }
@media (max-width: 480px) { .stat b { font-size: 30px; } .card h1 { font-size: 32px; } .slot { width: 40px; } }
/* ---------- Lobby 2.0: map cards with live minimaps ---------- */
.card.lobby { max-width: 1040px; gap: 22px; padding: 28px 30px 26px; border: 1px solid var(--line); border-top: 1px solid var(--line); background: linear-gradient(180deg, rgba(24, 25, 22, .95), rgba(11, 12, 10, .96)); box-shadow: 0 28px 80px rgba(0, 0, 0, .55); position: relative; }
.card.lobby::before { content: ""; position: absolute; left: -1px; top: -1px; width: 84px; height: 4px; background: var(--hazard); }
.lobby-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 28px; }
.card.lobby h1 { font-size: 46px; letter-spacing: .14em; margin-top: 6px; }
.lobby-intro { max-width: 380px; font-size: 13px; line-height: 1.75; }
.lobby-body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: stretch; }
.lobby-main, .lobby-side { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.lobby-side { justify-content: space-between; }
.card.lobby .lobby-sec { gap: 10px; }
.sec-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.card.lobby .sec-head h2 { font-size: 13px; letter-spacing: .2em; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { display: inline-block; }
.sw.house { width: 12px; height: 9px; background: #d9d2bf; }
.sw.shop { width: 10px; height: 10px; background: var(--hazard); box-shadow: 0 0 0 3px rgba(255, 122, 26, .25); }
.sw.spawn { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 2px rgba(143, 209, 79, .3); }

.lobby-maps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 4px; margin: -4px; }
.lobby-maps.solo { grid-template-columns: minmax(0, 260px); }
.mapcard { position: relative; display: flex; flex-direction: column; gap: 9px; padding: 8px 8px 11px; text-align: left; font-family: inherit; color: var(--ink); background: rgba(236, 230, 214, .04); border: 1px solid var(--line); cursor: pointer; min-width: 0; transition: border-color .15s, background .15s; }
.mapcard:hover { border-color: rgba(236, 230, 214, .45); background: rgba(236, 230, 214, .07); }
.mapcard[aria-pressed="true"] { border-color: rgba(255, 122, 26, .7); background: rgba(255, 122, 26, .08); }
.mapcard[aria-pressed="true"]::before, .mapcard[aria-pressed="true"]::after { content: ""; position: absolute; width: 14px; height: 14px; border: 0 solid var(--hazard); pointer-events: none; }
.mapcard[aria-pressed="true"]::before { left: -3px; top: -3px; border-width: 3px 0 0 3px; }
.mapcard[aria-pressed="true"]::after { right: -3px; bottom: -3px; border-width: 0 3px 3px 0; }
.mapfig { display: block; aspect-ratio: 1; border: 1px solid rgba(236, 230, 214, .12); overflow: hidden; }
.mini { display: block; width: 100%; height: 100%; transition: opacity .15s, filter .15s; }
.mapcard[aria-pressed="false"] .mini { opacity: .8; filter: saturate(.75); }
.mapcard[aria-pressed="false"]:hover .mini { opacity: .92; filter: none; }
.mapname { padding: 0 4px; font-size: 17px; font-weight: 700; letter-spacing: .08em; }
.mapmeta { display: flex; justify-content: space-between; gap: 8px; padding: 0 4px; font-size: 12px; color: var(--muted); }
.mapnote { margin: 0; min-height: 3.4em; font-size: 13px; line-height: 1.7; color: var(--muted); }

.mini .mg path { fill: none; stroke: rgba(236, 230, 214, .07); stroke-width: 1; vector-effect: non-scaling-stroke; }
.mini .mr { fill: #ece6d6; opacity: .1; }
.mini .mp { fill: rgba(236, 230, 214, .06); stroke: rgba(236, 230, 214, .42); stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
.mini .mw { fill: rgba(236, 230, 214, .07); stroke: rgba(236, 230, 214, .55); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.mini .mt { fill: rgba(236, 230, 214, .38); }
.mini .mh rect { fill: #d9d2bf; fill-opacity: .92; }
.mini .mhalo { fill: #ff7a1a; fill-opacity: .2; }
.mini .ms { fill: #ff7a1a; }
.mini .msp { fill: #8fd14f; }
.mini .msr { fill: none; stroke: #8fd14f; stroke-opacity: .55; stroke-width: 1; vector-effect: non-scaling-stroke; }
.mini text { font-family: var(--font-cjk); font-weight: 700; fill: #ff7a1a; paint-order: stroke; stroke-linejoin: round; }

.whos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.who { display: flex; gap: 10px; align-items: center; min-width: 0; padding: 10px 12px; text-align: left; font-family: inherit; color: var(--ink); background: rgba(236, 230, 214, .04); border: 1px solid var(--line); cursor: pointer; transition: border-color .15s, background .15s; }
.who:hover { border-color: rgba(236, 230, 214, .45); background: rgba(236, 230, 214, .07); }
.who[aria-pressed="true"] { border-color: rgba(255, 122, 26, .7); background: rgba(255, 122, 26, .12); }
.who .avatar { --skin: #4a443b; flex: 0 0 32px; width: 44px; height: 42px; transform: scale(.72); transform-origin: 0 0; }
.who .avatar .hd, .who .avatar .lg { background: var(--skin); }
.whotxt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.whotxt b { font-size: 15px; letter-spacing: .08em; }
.whotxt .role { font-size: 12px; color: var(--hazard); }
.whotxt small { font-size: 12px; line-height: 1.5; color: var(--muted); }

.modes { display: flex; flex-direction: column; gap: 8px; }
.modecard { display: flex; flex-direction: column; gap: 3px; padding: 10px 14px; text-align: left; font-family: inherit; color: var(--ink); background: rgba(236, 230, 214, .04); border: 1px solid var(--line); border-left-width: 3px; cursor: pointer; transition: border-color .15s, background .15s; }
.modecard:hover { border-color: rgba(236, 230, 214, .45); background: rgba(236, 230, 214, .07); }
.modecard[aria-pressed="true"] { border-color: rgba(255, 122, 26, .7); background: rgba(255, 122, 26, .12); }
.modecard b { font-size: 15px; letter-spacing: .08em; }
.modecard small { font-size: 12px; line-height: 1.55; color: var(--muted); }
.deploy { display: flex; flex-direction: column; gap: 12px; }
.deploy .best { display: flex; justify-content: space-between; align-items: baseline; }
.deploy .go { padding-block: 16px; }

@media (max-width: 860px) {
  .lobby-body { grid-template-columns: minmax(0, 1fr); gap: 22px; }
  .lobby-intro { display: none; }
  .card.lobby { padding: 20px 16px; }
  .card.lobby h1 { font-size: 34px; }
  .lobby-maps { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: min(72%, 250px); overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px; }
  .lobby-maps.solo { grid-auto-columns: min(100%, 260px); }
  .mapcard { scroll-snap-align: start; }
  .whos { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------- settings ---------- */
.card.settings { max-width: 600px; gap: 14px; max-height: calc(100vh - 32px); overflow-y: auto; }
.card.settings h1 { font-size: 30px; }
.sgroup { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.sgroup > h2 { margin: 0; font-size: 12px; letter-spacing: .24em; color: var(--muted); font-weight: 400; }
.srow { display: grid; grid-template-columns: 112px 1fr 54px; align-items: center; gap: 12px; font-size: 14px; }
.srow.simple { grid-template-columns: 112px 1fr; }
.srow input[type=range] { width: 100%; accent-color: var(--hazard); }
.srow output { font-family: var(--font-num); font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button, .keybtn { font-family: inherit; font-size: 13px; padding: 7px 12px; background: rgba(236,230,214,.04); color: var(--ink); border: 1px solid var(--line); cursor: pointer; }
.seg button[aria-pressed="true"] { border-color: rgba(255,122,26,.8); background: rgba(255,122,26,.16); }
.seg button:hover, .keybtn:hover { border-color: rgba(236,230,214,.5); }
.keygrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; }
.krow { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; }
.keybtn { min-width: 84px; font-family: var(--font-num), var(--font-cjk); font-weight: 700; text-align: center; }
.keybtn.listen { border-color: var(--hazard); color: var(--hazard); }

    h += '<div class="dstat" id="duStat"></div><button class="ghost" id="duBack" type="button">' + zt('取消', 'Cancel') + '</button>';
    duCard(h, function () { duHostPanel(!DU.code); });
    $('duBack').addEventListener('click', function () { duCloseConn(); DU.err = ''; duHome(); });
    if (!pending) $('duCopy').addEventListener('click', function () { duCopy('duCode', $('duCopy')); });
  }
  function duJoinPanel() {
    DU.ui = 'join';
    var h = duHead('ROOM DUEL · JOIN', '房间单挑 · 加入', zt('加入房间', 'Join a room'));
    h += '<div class="dstep"><b>' + zt('输入房主给你的房间号', 'ENTER THE ROOM NUMBER FROM THE HOST') + '</b><input class="dtext" type="text" id="duIn" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="1234" value="' + duEsc(DU.joinIn || '') + '" style="font-size:30px;letter-spacing:.4em;text-align:center"></div>';
    h += duServerBox();
    h += '<div class="dstat" id="duStat"></div><div class="drow"><button class="go" id="duGo" type="button">' + zt('加入', 'Join') + '</button></div>';
    h += '<button class="ghost" id="duBack" type="button">' + zt('取消', 'Cancel') + '</button>';
    duCard(h, duJoinPanel);
    $('duBack').addEventListener('click', function () { duCloseConn(); DU.err = ''; duHome(); });
    $('duGo').addEventListener('click', function () {
      var v = $('duIn').value.trim();
      if (!v) { duStat(zt('先输入房间号', 'Enter the room number first'), 'err'); return; }
      DU.joinIn = v;
      var srv = duReadSrv();
      $('duGo').disabled = true;
      duStat(zt('正在连接服务器…', 'Connecting to the server…'), '');
      dConnect(srv, { op: 'join', code: v }, function (msg) { duStat(msg, 'err'); duUnlock(); });
    });
  }
  function duReadyPanel() {
    DU.ui = 'ready';
    var ch = CHARS[DU.opChar];
    var h = duHead('CONNECTED', '已连接', zt('房间已就绪', 'Room is ready'));
    h += '<p>' + zt('对手角色：', 'Opponent: ') + t(ch.name) + ' · ' + t(ch.role) + '<br>' + zt('先到 ', 'First to ') + DU.target + zt(' 分获胜 · 地图：单挑竞技场（36 × 36 米）', ' wins · Map: Duel Arena (36 × 36 m)') + (DU.opReady ? '<br><b style="color:var(--ok)">' + zt('对手已准备好', 'Opponent is ready') + '</b>' : '') + '</p>';
    h += '<button class="go" id="duReady" type="button">' + zt('准备开战', 'Ready') + '</button><button class="ghost" id="duQuit" type="button">' + zt('离开房间', 'Leave room') + '</button>';
    duCard(h, duReadyPanel);
    $('duReady').addEventListener('click', duBegin);
    $('duQuit').addEventListener('click', function () { DU.leave(true); });
  }
  function duEndCard(note) {
    var live = DU.connected, win = DU.me > DU.op;
    var title = !live ? zt('对战中断', 'Match ended') : win ? zt('胜利', 'Victory') : zt('落败', 'Defeat');
    var h = duHead('MATCH OVER', '对战结束', title);
    h += '<p>' + zt('比分 ', 'Score ') + DU.me + ' : ' + DU.op + (note ? '<br>' + duEsc(note) : '') + (live && DU.opAgain && !DU.again ? '<br><b style="color:var(--ok)">' + zt('对手想再来一局', 'The opponent wants a rematch') + '</b>' : '') + '</p>';
    if (live) h += '<button class="go" id="duAgain" type="button"' + (DU.again ? ' disabled' : '') + '>' + (DU.again ? zt('等待对手…', 'Waiting…') : zt('再来一局', 'Rematch')) + '</button>';
    h += '<button class="ghost" id="duQuit" type="button">' + zt('离开房间', 'Leave room') + '</button>';
    duCard(h, function () { duEndCard(note); });
    var ag = $('duAgain');
    if (ag) ag.addEventListener('click', function () { DU.again = true; dSend({ t: 'a' }); ag.disabled = true; ag.textContent = zt('等待对手…', 'Waiting…'); duCheckAgain(); });
    $('duQuit').addEventListener('click', function () { DU.leave(true); });
  }
  DU.pauseMenu = function () {
    if (DU.phase === 'end' || DU.phase === 'idle') return;
    releaseInput();
    var h = duHead('PAUSED', '已暂停', zt('房间单挑', 'Room duel'));
    h += '<p>' + zt('联机对战不会暂停，对手仍在行动，别离开太久。', 'Online matches do not pause. Your opponent keeps playing.') + '</p>';
    h += '<button class="go" id="duResume" type="button">' + zt('继续', 'Resume') + '</button><button class="ghost" id="duQuit" type="button">' + zt('离开房间', 'Leave room') + '</button>';
    duCard(h, DU.pauseMenu);
    $('duResume').addEventListener('click', function () { $('menu').hidden = true; requestLock(); });
    $('duQuit').addEventListener('click', function () { DU.leave(true); });
  };
  DU.panel = function () { DU.err = ''; duHome(); };
  canvas.addEventListener('mousedown', function () {
    if (duel && state === 'playing' && !isTouch && !document.pointerLockElement && $('menu').hidden) requestLock();
  });

  /* ---------- loop ---------- */
  var last = performance.now();
  var fpsN = 0, fpsT = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    var el = now - last;
    if (SET.fps > 0) {
      var minDt = 1000 / SET.fps;
      if (el < minDt - 1) return;                    // too early: skip this display refresh to hold the cap
      last = now - (el % minDt);
    } else last = now;
    var dt = Math.min(0.05, el / 1000);
    if (SET.showFps) {
      fpsN++; fpsT += el;
      if (fpsT >= 500) { fpsMeter.textContent = Math.round(fpsN * 1000 / fpsT) + ' FPS'; fpsN = 0; fpsT = 0; }
    }
    if (state === 'playing') update(dt);
    else if (state === 'menu') {
      menuT += dt * 0.18;
      camera.position.set(Math.cos(menuT) * A * 0.75, A * 0.3 + 3, Math.sin(menuT) * A * 0.75);
      camera.lookAt(0, 1, 0);
    } else if (state === 'over') {
      stepParts(dt);
    }
    renderer.render(scene, camera);
  }

  loadMap(mapId);
  showMenu('menu');
  requestAnimationFrame(frame);
})();
</script>

</body></html>
